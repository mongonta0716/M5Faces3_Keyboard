; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32 @ 6.12.0 ;6.4.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_flags = -DCORE_DEBUG_LEVEL=4
lib_deps =
    m5stack/M5Unified
    https://github.com/m5stack/M5Faces.git

lib_ldf_mode = deep+
;タカヲ専用のリモート開発用スクリプト
;extra_scripts =
;    post:scripts/copy_firmware.py

; M5Facesライブラリはlibrary.propertiesでM5Unifiedへの依存を宣言していないため、
; Library Dependency FinderがM5Faces自身のビルド時にM5Unifiedのインクルードパスを
; 自動追加しない（__has_include(<utility/I2C_Class.hpp>)がfalseになり、
; M5Unified I2C_Class向けのbegin()実装がリンクエラーになる）。
; M5Stack公式のPlatformIOサンプル(examples/PlatformIO/M5Core_Faces3)と同様に、
; 環境ごとに明示的なインクルードパスを追加して回避する。
[env:m5stack-core2]
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -I .pio/libdeps/m5stack-core2/M5Unified/src

[env:m5stack-grey]
; Flash16MBのBasicはこちらを使ってください。
board = m5stack-grey
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload_maximum_ram_size = 327680
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I .pio/libdeps/m5stack-grey/M5Unified/src

[env:m5stack-fire]
; fireはespressif32最新版(5.x)で動かない場合は下記の1行をコメントアウトしてください。
;platform = espressif32 @ 4.4.0
board = m5stack-fire
build_flags =
    ${env.build_flags}
    -I .pio/libdeps/m5stack-fire/M5Unified/src

[env:m5stack-core-esp32]
; Flash 16MBのBasicはm5stack-greyを使ってください。
board = m5stack-core-esp32
board_build.flash_mode = qio
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I .pio/libdeps/m5stack-core-esp32/M5Unified/src
; Flash 4MB
board_build.partitions = huge_app.csv

[env:m5stack-cores3]
board = m5stack-cores3
build_flags =
    ${env.build_flags}
    -I .pio/libdeps/m5stack-cores3/M5Unified/src